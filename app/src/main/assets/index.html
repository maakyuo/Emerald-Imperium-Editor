<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#101827;color:white;font:16px system-ui;padding:15px}section{background:#25334a;padding:14px;border-radius:12px;margin:12px 0}button,input{padding:10px;margin:5px;max-width:90%}button{background:#8fc5ff;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h2>에메랄드 임페리움 세이브 에디터</h2><p>파티 포켓몬 능력치 편집 및 세이브 체크섬 자동 갱신</p><section><input type="file" id="file" accept=".sav"><p id="status">세이브를 선택해줘.</p></section><section><h3>섹터 검사</h3><pre id="sectors"></pre></section><section><h3>파티 포켓몬 능력치 편집</h3><div id="party">세이브를 불러오면 표시됩니다.</div></section><section><h3>바이트 편집 (16진수)</h3><input id="offset" placeholder="파일 오프셋" value="5000"><input id="value" placeholder="값" value="00" maxlength="2"><button onclick="inspect()">읽기</button><button onclick="change()">수정</button><p id="byte"></p></section><section><button onclick="save()">수정본 SAV 내보내기</button></section><script>
let data=null,valid=false;const $=x=>document.getElementById(x),u16=(a,p)=>a[p]|a[p+1]<<8,u32=(a,p)=>(a[p]|a[p+1]<<8|a[p+2]<<16|a[p+3]<<24)>>>0;function put16(a,p,v){a[p]=v&255;a[p+1]=v>>8&255}function sum(a,b){let s=0;for(let p=b;p<b+0xff4;p+=4)s=(s+u32(a,p))>>>0;return((s&65535)+(s>>>16))&65535}
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;data=new Uint8Array(await f.arrayBuffer());valid=data.length===131072;let ids=new Set(),lines=[];if(valid)for(let i=0;i<28;i++){let b=i*4096,id=u16(data,b+0xff4),sig=u32(data,b+0xff8),ok=u16(data,b+0xff6)===sum(data,b);ids.add(id);if(sig!==0x08012025||!ok)valid=false;lines.push('섹터 '+i+' / ID '+id+' / '+(ok?'정상':'체크섬 오류'));}if(ids.size!==28||[...ids].some(x=>x>27))valid=false;$('sectors').textContent=lines.join('\n');$('status').textContent=valid?'검증 성공. 수정 가능':'검증 실패. 수정 차단';};
function inspect(){if(!data)return;let p=parseInt($('offset').value,16);$('byte').textContent=p>=0&&p<data.length?'0x'+p.toString(16)+': '+data[p].toString(16).padStart(2,'0'):'잘못된 주소'}
function change(){if(!valid)return alert('검증된 세이브만 수정 가능');let p=parseInt($('offset').value,16),s=$('value').value;if(!/^[0-9a-f]{1,2}$/i.test(s)||!Number.isInteger(p)||p<0||p>=28*4096||p%4096>=0xff4)return alert('잘못된 주소/값');data[p]=parseInt(s,16);let b=Math.floor(p/4096)*4096;put16(data,b+0xff6,sum(data,b));inspect();}
function save(){if(!valid)return alert('검증 실패');let str='';for(let i=0;i<data.length;i+=8192)str+=String.fromCharCode(...data.subarray(i,i+8192));AndroidSave.exportSave(btoa(str));}

function partyDiagnostics(){if(!data)return;const sec=[...Array(28)].map((_,i)=>i*4096).find(p=>u16(data,p+0xff4)===1);if(sec===undefined){$('party').textContent='섹터 ID 1 없음';return;}const count=u32(data,sec+0x234);if(count>6){$('party').textContent='파티 수가 비정상적이어서 편집을 중단합니다.';return;}let html='<p>파티 '+count+'마리 · 변경 후 저장 버튼을 눌러주세요.</p>';const fields=[['level','레벨',0x44,1,100],['hp','현재 HP',0x46,0,65535],['maxhp','최대 HP',0x48,1,65535],['atk','공격',0x4a,0,65535],['def','방어',0x4c,0,65535],['speed','스피드',0x4e,0,65535],['spa','특수공격',0x50,0,65535],['spd','특수방어',0x52,0,65535]];for(let n=0;n<count;n++){const p=sec+0x238+n*84;html+='<fieldset style="border:1px solid #53627a;border-radius:10px;margin:12px 0"><legend>포켓몬 '+(n+1)+'</legend>';for(const [key,label,off,min,max] of fields){const v=off===0x44?data[p+off]:u16(data,p+off);html+='<label style="display:inline-block;margin:4px">'+label+'<input style="display:block;width:85px" type="number" min="'+min+'" max="'+max+'" value="'+v+'" data-pos="'+(p+off)+'" data-width="'+(off===0x44?1:2)+'"></label>';}html+='</fieldset>';}html+='<button onclick="applyParty()">파티 능력치 수정 적용</button>';$('party').innerHTML=html;}
function applyParty(){if(!valid)return alert('유효한 세이브만 수정할 수 있습니다.');const fields=[...$('party').querySelectorAll('input[data-pos]')];for(const f of fields){const v=Number(f.value),min=Number(f.min),max=Number(f.max);if(!Number.isInteger(v)||v<min||v>max)return alert('능력치 범위를 확인해 주세요.');}for(const f of fields){const p=Number(f.dataset.pos),v=Number(f.value);if(Number(f.dataset.width)===1)data[p]=v;else put16(data,p,v);}const sec=[...Array(28)].map((_,i)=>i*4096).find(p=>u16(data,p+0xff4)===1);put16(data,sec+0xff6,sum(data,sec));alert('파티 능력치가 적용됐습니다. SAV 내보내기를 눌러주세요.');}
const previousLoad=$('file').onchange;
$('file').onchange=async e=>{await previousLoad(e);partyDiagnostics();};
</script></html>
